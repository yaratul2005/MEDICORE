<div id="diagnoses-list" class="space-y-1.5">
  {% for dx in diagnoses %}
  <div class="p-2 rounded-lg border border-subtle surface-bg flex items-center justify-between text-xs hover:border-teal-500/40 transition-colors">
    <div class="flex items-center gap-2">
      <span class="font-mono font-bold text-teal-600 dark:text-teal-400">{{ dx.icd10_code }}</span>
      <span class="text-main font-medium">{{ dx.description }}</span>
      {% if dx.is_primary %}
      <span class="px-1.5 py-0.2 rounded font-mono text-[9px] uppercase font-bold bg-teal-100 text-teal-800 dark:bg-teal-950 dark:text-teal-300 border border-teal-200 dark:border-teal-800">Primary</span>
      {% else %}
      <span class="px-1.5 py-0.2 rounded font-mono text-[9px] uppercase bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300">Secondary</span>
      {% endif %}
    </div>

    {% if can_write %}
    <button hx-delete="/consultations/encounter/{{ encounter.id }}/diagnoses/{{ dx.id }}"
            hx-target="#diagnoses-list"
            hx-swap="outerHTML"
            class="text-muted hover:text-rose-600 p-1 transition-colors">
      <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
    </button>
    {% endif %}
  </div>
  {% else %}
  <div class="p-3 text-center text-muted text-xs border border-dashed border-subtle rounded-lg">
    No ICD-10 diagnoses added yet. Search or click a common diagnosis below.
  </div>
  {% endfor %}
</div>
<script>lucide.createIcons();</script>
