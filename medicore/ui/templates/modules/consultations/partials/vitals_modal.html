<div id="vitals-modal" class="hidden fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
  <div class="relative surface-bg rounded-xl max-w-lg w-full border border-subtle shadow-xl overflow-hidden animate-scale-up"
       x-data="{
         height: '',
         weight: '',
         systolic: '',
         diastolic: '',
         pulse: '',
         temp: '',
         spo2: '',
         get bmi() {
           let h = parseFloat(this.height);
           let w = parseFloat(this.weight);
           if (!h || !w || h <= 0) return '-';
           let hm = h / 100.0;
           return (w / (hm * hm)).toFixed(1);
         },
         get bsa() {
           let h = parseFloat(this.height);
           let w = parseFloat(this.weight);
           if (!h || !w || h <= 0 || w <= 0) return '-';
           return Math.sqrt((h * w) / 3600.0).toFixed(2);
         }
       }">
    
    <!-- Modal Header -->
    <div class="px-5 py-3.5 border-b border-subtle bg-slate-50/50 dark:bg-slate-900/40 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded-lg bg-teal-100 dark:bg-teal-950 text-teal-600 dark:text-teal-400 flex items-center justify-center">
          <i data-lucide="activity" class="w-4 h-4"></i>
        </div>
        <div>
          <h3 class="text-sm font-bold text-main">Record Patient Vital Signs</h3>
          <p class="text-[11px] text-muted">Auto-computes BMI & Mosteller BSA in real time</p>
        </div>
      </div>
      <button type="button" onclick="document.getElementById('vitals-modal').classList.add('hidden')"
              class="text-muted hover:text-main p-1 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- Modal Form -->
    <form hx-post="/consultations/encounter/{{ encounter.id }}/vitals"
          hx-target="#pane-timeline"
          hx-swap="outerHTML"
          onsubmit="document.getElementById('vitals-modal').classList.add('hidden')"
          class="p-5 space-y-4 text-xs">

      <!-- Physical Measurements: Height & Weight -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block font-semibold text-secondary mb-1">Height (cm)</label>
          <input type="number" step="0.1" name="height_cm" x-model="height" placeholder="e.g. 175"
                 class="w-full px-3 py-2 rounded-lg border border-subtle app-bg text-main font-mono focus:ring-1 focus:ring-teal-500 focus:outline-none">
        </div>
        <div>
          <label class="block font-semibold text-secondary mb-1">Weight (kg)</label>
          <input type="number" step="0.1" name="weight_kg" x-model="weight" placeholder="e.g. 70"
                 class="w-full px-3 py-2 rounded-lg border border-subtle app-bg text-main font-mono focus:ring-1 focus:ring-teal-500 focus:outline-none">
        </div>
      </div>

      <!-- Live Calculated BMI & BSA Indicators -->
      <div class="grid grid-cols-2 gap-3 p-3 rounded-lg bg-teal-50/50 dark:bg-teal-950/30 border border-teal-200/60 dark:border-teal-900/60">
        <div>
          <span class="text-[10px] uppercase font-bold text-teal-800 dark:text-teal-300 block">Calculated BMI</span>
          <span class="font-mono text-base font-bold text-teal-700 dark:text-teal-300" x-text="bmi"></span>
          <span class="text-[10px] text-muted">kg/m²</span>
        </div>
        <div>
          <span class="text-[10px] uppercase font-bold text-teal-800 dark:text-teal-300 block">Body Surface Area (BSA)</span>
          <span class="font-mono text-base font-bold text-teal-700 dark:text-teal-300" x-text="bsa"></span>
          <span class="text-[10px] text-muted">m² (Mosteller)</span>
        </div>
      </div>

      <!-- Hemodynamics: BP & Pulse -->
      <div class="grid grid-cols-3 gap-3">
        <div>
          <label class="block font-semibold text-secondary mb-1">Systolic (mmHg)</label>
          <input type="number" name="systolic" x-model="systolic" placeholder="120"
                 class="w-full px-3 py-2 rounded-lg border border-subtle app-bg text-main font-mono focus:ring-1 focus:ring-teal-500 focus:outline-none">
        </div>
        <div>
          <label class="block font-semibold text-secondary mb-1">Diastolic (mmHg)</label>
          <input type="number" name="diastolic" x-model="diastolic" placeholder="80"
                 class="w-full px-3 py-2 rounded-lg border border-subtle app-bg text-main font-mono focus:ring-1 focus:ring-teal-500 focus:outline-none">
        </div>
        <div>
          <label class="block font-semibold text-secondary mb-1">Pulse (bpm)</label>
          <input type="number" name="pulse" x-model="pulse" placeholder="72"
                 class="w-full px-3 py-2 rounded-lg border border-subtle app-bg text-main font-mono focus:ring-1 focus:ring-teal-500 focus:outline-none">
        </div>
      </div>

      <!-- Respiratory & Systemic: Temp, SpO2, RR -->
      <div class="grid grid-cols-3 gap-3">
        <div>
          <label class="block font-semibold text-secondary mb-1">Temp (°C)</label>
          <input type="number" step="0.1" name="temp_c" x-model="temp" placeholder="36.8"
                 class="w-full px-3 py-2 rounded-lg border border-subtle app-bg text-main font-mono focus:ring-1 focus:ring-teal-500 focus:outline-none">
        </div>
        <div>
          <label class="block font-semibold text-secondary mb-1">SpO₂ (%)</label>
          <input type="number" step="0.1" name="spo2" x-model="spo2" placeholder="98"
                 class="w-full px-3 py-2 rounded-lg border border-subtle app-bg text-main font-mono focus:ring-1 focus:ring-teal-500 focus:outline-none">
        </div>
        <div>
          <label class="block font-semibold text-secondary mb-1">Resp Rate (/min)</label>
          <input type="number" name="resp_rate" placeholder="16"
                 class="w-full px-3 py-2 rounded-lg border border-subtle app-bg text-main font-mono focus:ring-1 focus:ring-teal-500 focus:outline-none">
        </div>
      </div>

      <div>
        <label class="block font-semibold text-secondary mb-1">Clinical Triage Notes</label>
        <input type="text" name="notes" placeholder="e.g. Patient rested 5 minutes prior to BP reading"
               class="w-full px-3 py-2 rounded-lg border border-subtle app-bg text-main focus:ring-1 focus:ring-teal-500 focus:outline-none">
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center justify-end gap-2 pt-3 border-t border-subtle">
        <button type="button" onclick="document.getElementById('vitals-modal').classList.add('hidden')"
                class="px-3 py-2 rounded-lg border border-subtle surface-hover text-secondary font-medium transition-colors">
          Cancel
        </button>
        <button type="submit"
                class="px-4 py-2 rounded-lg bg-teal-600 hover:bg-teal-700 text-white font-semibold transition-colors shadow-xs flex items-center gap-1.5">
          <i data-lucide="check" class="w-4 h-4"></i>
          <span>Save Vitals</span>
        </button>
      </div>
    </form>

  </div>
</div>
