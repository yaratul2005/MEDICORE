{% extends "base.html" %}

{% block title %}New Lab Requisition{% endblock %}

{% block content %}
<div class="h-full flex flex-col overflow-hidden bg-slate-50 dark:bg-slate-950">
  <header class="surface-bg border-b border-subtle px-6 py-3.5 flex items-center justify-between flex-shrink-0">
    <div class="flex items-center gap-3">
      <a href="/laboratory" class="p-1.5 rounded-lg border border-subtle surface-hover text-muted hover:text-main">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
      </a>
      <div>
        <h1 class="text-base font-bold text-main">New Laboratory Requisition</h1>
        <p class="text-xs text-muted">Create a manual or walk-in patient diagnostic test order</p>
      </div>
    </div>
  </header>

  <div class="flex-1 overflow-auto p-6 flex justify-center">
    <div class="w-full max-w-2xl surface-bg border border-subtle rounded-xl shadow-sm p-6">
      <form action="/laboratory/orders/new" method="POST" class="space-y-4 text-xs">
        
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="font-semibold text-main block mb-1">Patient Full Name *</label>
            <input type="text" name="patient_name" required placeholder="e.g. Johnathan Doe" class="w-full px-3 py-2 rounded-lg border border-subtle surface-bg text-main">
          </div>
          <div>
            <label class="font-semibold text-main block mb-1">MRN (Medical Record Number) *</label>
            <input type="text" name="patient_mrn" required placeholder="e.g. MRN-10023" class="w-full px-3 py-2 rounded-lg border border-subtle surface-bg text-main font-mono">
          </div>
        </div>

        <div class="grid grid-cols-3 gap-4">
          <div>
            <label class="font-semibold text-main block mb-1">Gender</label>
            <select name="patient_gender" class="w-full px-3 py-2 rounded-lg border border-subtle surface-bg text-main">
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div>
            <label class="font-semibold text-main block mb-1">Priority</label>
            <select name="priority" class="w-full px-3 py-2 rounded-lg border border-subtle surface-bg text-main">
              <option value="Routine">Routine</option>
              <option value="Urgent">Urgent</option>
              <option value="STAT">STAT (Emergency - 60 min)</option>
            </select>
          </div>
          <div>
            <label class="font-semibold text-main block mb-1">Ordering Doctor</label>
            <input type="text" name="doctor_name" value="Dr. Sarah Jenkins" class="w-full px-3 py-2 rounded-lg border border-subtle surface-bg text-main">
          </div>
        </div>

        <div>
          <label class="font-semibold text-main block mb-1">Investigation / Test Panel *</label>
          <select name="test_id" required class="w-full px-3 py-2 rounded-lg border border-subtle surface-bg text-main">
            {% for t in tests %}
            <option value="{{ t.id }}">{{ t.name }} ({{ t.code }}) - {{ t.department }} • ${{ "%.2f"|format(t.price) }}</option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label class="font-semibold text-main block mb-1">Clinical Indication / Notes</label>
          <textarea name="clinical_notes" rows="2" placeholder="e.g. Acute fatigue, rule out anemia or thyroid disorder" class="w-full px-3 py-2 rounded-lg border border-subtle surface-bg text-main"></textarea>
        </div>

        <div class="pt-4 border-t border-subtle flex justify-end gap-3">
          <a href="/laboratory" class="px-4 py-2 rounded-lg border border-subtle text-secondary hover:surface-hover">Cancel</a>
          <button type="submit" class="px-5 py-2 rounded-lg bg-teal-600 hover:bg-teal-700 text-white font-semibold flex items-center gap-1.5 shadow-xs">
            <i data-lucide="check" class="w-4 h-4"></i>
            <span>Create Requisition & Barcode</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
