<div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
  <div class="surface-bg rounded-xl border border-subtle shadow-xl max-w-sm w-full p-5 text-slate-800 dark:text-slate-100">
    <div class="flex items-center justify-between border-b border-subtle pb-3 mb-4">
      <h3 class="font-bold text-sm text-main flex items-center gap-1.5">
        <i data-lucide="qr-code" class="w-4 h-4 text-teal-600"></i>
        Specimen Barcode Label
      </h3>
      <button onclick="document.getElementById('global-modal').innerHTML = ''" class="text-muted hover:text-main text-xs">✕</button>
    </div>

    <!-- Printable Barcode Card -->
    <div id="barcode-card" class="p-4 rounded-lg bg-white text-slate-900 border-2 border-dashed border-slate-300 text-center font-mono space-y-2">
      <div class="text-[10px] uppercase font-bold tracking-wider text-slate-500">MediCore Central Pathology</div>
      <div class="text-sm font-bold truncate">{{ order.patient_name }}</div>
      <div class="text-xs text-slate-600">MRN: {{ order.patient_mrn }} • {{ order.patient_gender }}</div>
      
      <!-- Barcode Graphic Simulation -->
      <div class="py-2 flex flex-col items-center justify-center">
        <div class="h-10 w-48 bg-slate-900 flex items-center justify-between px-1 tracking-widest text-[8px] text-white overflow-hidden">
          ||||| | |||| || ||| |||| | ||| ||||| || |||
        </div>
        <span class="font-bold text-xs mt-1 tracking-widest">{{ specimen.barcode }}</span>
      </div>

      <div class="text-[10px] text-slate-600 flex justify-between border-t border-slate-200 pt-1">
        <span>{{ specimen.specimen_type }}</span>
        <span>{{ order.priority }}</span>
      </div>
    </div>

    <div class="flex justify-end gap-2 pt-4">
      <button onclick="document.getElementById('global-modal').innerHTML = ''" class="px-3 py-1.5 rounded-lg border border-subtle text-secondary text-xs">Close</button>
      <button onclick="window.print()" class="px-3 py-1.5 rounded-lg bg-teal-600 hover:bg-teal-700 text-white text-xs font-semibold flex items-center gap-1 shadow-xs">
        <i data-lucide="printer" class="w-3.5 h-3.5"></i>
        <span>Print Label</span>
      </button>
    </div>
  </div>
</div>
<script>lucide.createIcons();</script>
