<div class="surface-bg border border-subtle rounded-xl p-4 space-y-3">
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-teal-600/10 text-teal-600 flex items-center justify-center font-bold">
        <i data-lucide="pill" class="w-4 h-4"></i>
      </div>
      <div>
        <h4 class="text-xs font-bold text-main">Pharmacy Stock Status</h4>
        <p class="text-[10px] text-muted">Real-Time Inventory Alerts</p>
      </div>
    </div>
    <a href="/pharmacy?tab=inventory&low_stock_only=true" class="text-[11px] font-semibold text-teal-600 hover:underline">View All</a>
  </div>

  <div class="grid grid-cols-3 gap-2 text-center">
    <div class="p-2 rounded-lg bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800/60">
      <div class="text-lg font-bold text-amber-700 dark:text-amber-400 font-mono">{{ low_stock_count }}</div>
      <div class="text-[10px] text-amber-800 dark:text-amber-300 font-medium">Low Stock</div>
    </div>
    <div class="p-2 rounded-lg bg-sky-50 dark:bg-sky-950/40 border border-sky-200 dark:border-sky-800/60">
      <div class="text-lg font-bold text-sky-700 dark:text-sky-400 font-mono">{{ near_expiry_count }}</div>
      <div class="text-[10px] text-sky-800 dark:text-sky-300 font-medium">Near Expiry</div>
    </div>
    <div class="p-2 rounded-lg bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800/60">
      <div class="text-lg font-bold text-rose-700 dark:text-rose-400 font-mono">{{ expired_count }}</div>
      <div class="text-[10px] text-rose-800 dark:text-rose-300 font-medium">Expired</div>
    </div>
  </div>

  {% if expired_count > 0 %}
  <form method="POST" action="/pharmacy/inventory/quarantine">
    <button type="submit" class="w-full py-1.5 px-3 rounded-lg bg-rose-600 hover:bg-rose-700 text-white text-[11px] font-semibold flex items-center justify-center gap-1.5 transition-colors shadow-xs">
      <i data-lucide="shield-alert" class="w-3.5 h-3.5"></i>
      <span>Quarantine {{ expired_count }} Expired Batches</span>
    </button>
  </form>
  {% endif %}
</div>
