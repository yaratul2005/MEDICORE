<div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="surface-bg border border-subtle rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[90vh]">
    
    <!-- Modal Header -->
    <div class="h-12 border-b border-subtle px-5 flex items-center justify-between bg-slate-50/50 dark:bg-slate-900/30">
      <div class="flex items-center gap-2">
        <i data-lucide="calendar-plus" class="w-4 h-4 text-teal-600"></i>
        <h2 class="text-sm font-bold text-main">Book Clinical Appointment</h2>
      </div>
      <button onclick="document.getElementById('modal-container').innerHTML = ''" 
              class="p-1 rounded-lg surface-hover text-muted hover:text-main">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- Booking Form -->
    <form id="new-appt-form"
          hx-post="/appointments"
          hx-target="#modal-container"
          class="flex-1 overflow-y-auto p-5 space-y-4">
      
      <!-- Conflict Warning Placeholder -->
      {% if conflict_error %}
      <div class="p-3 rounded-lg bg-rose-50 dark:bg-rose-950/30 border border-rose-200 dark:border-rose-900 flex items-start gap-2.5">
        <i data-lucide="alert-circle" class="w-4 h-4 text-rose-600 flex-shrink-0 mt-0.5"></i>
        <div class="text-xs text-rose-700 dark:text-rose-400">
          <span class="font-bold">Schedule Conflict:</span> {{ conflict_error }}
        </div>
      </div>
      {% endif %}

      <div class="grid grid-cols-2 gap-4">
        <!-- Patient Selection -->
        <div class="col-span-2">
          <label class="block text-xs font-semibold text-secondary mb-1">Patient <span class="text-rose-500">*</span></label>
          {% if pre_patient %}
            <div class="flex items-center justify-between p-2.5 rounded-lg border border-subtle bg-slate-50 dark:bg-slate-900">
              <div class="flex items-center gap-2">
                <span class="font-mono text-xs font-bold text-teal-600 dark:text-teal-400">{{ pre_patient.mrn }}</span>
                <span class="text-xs font-medium text-main">{{ pre_patient.full_name }}</span>
                <span class="text-[11px] text-muted">({{ pre_patient.phone }})</span>
              </div>
              <input type="hidden" name="patient_id" value="{{ pre_patient.id }}">
            </div>
          {% else %}
            <select name="patient_id" required class="w-full text-xs rounded-lg border border-subtle px-3 py-2 bg-transparent text-main focus:outline-none focus:border-teal-500">
              <option value="">-- Choose Patient --</option>
              {% for p in patients %}
                <option value="{{ p.id }}">{{ p.mrn }} - {{ p.full_name }} ({{ p.phone }})</option>
              {% endfor %}
            </select>
          {% endif %}
        </div>

        <!-- Doctor Selection -->
        <div class="col-span-1">
          <label class="block text-xs font-semibold text-secondary mb-1">Doctor <span class="text-rose-500">*</span></label>
          <select id="doctor_id" 
                  name="doctor_id" 
                  required 
                  hx-get="/appointments/slots"
                  hx-trigger="change"
                  hx-include="#new-appt-form"
                  hx-target="#slot-picker-container"
                  class="w-full text-xs rounded-lg border border-subtle px-3 py-2 bg-transparent text-main focus:outline-none focus:border-teal-500">
            <option value="">-- Select Doctor --</option>
            {% for d in doctors %}
              <option value="{{ d.id }}" {% if selected_doctor_id == d.id %}selected{% endif %}>
                {{ d.name }} ({{ d.department }} - {{ d.room_number or 'Rm 1' }})
              </option>
            {% endfor %}
          </select>
        </div>

        <!-- Appointment Date -->
        <div class="col-span-1">
          <label class="block text-xs font-semibold text-secondary mb-1">Appointment Date <span class="text-rose-500">*</span></label>
          <input type="date" 
                 id="appointment_date"
                 name="appointment_date" 
                 value="{{ default_date }}" 
                 required
                 hx-get="/appointments/slots"
                 hx-trigger="change"
                 hx-include="#new-appt-form"
                 hx-target="#slot-picker-container"
                 class="w-full text-xs rounded-lg border border-subtle px-3 py-2 bg-transparent text-main focus:outline-none focus:border-teal-500">
        </div>
      </div>

      <!-- Slot Picker Container -->
      <div id="slot-picker-container">
        {% include "modules/appointments/slots_partial.html" %}
      </div>

      <div class="grid grid-cols-2 gap-4">
        <!-- Selected Start Time -->
        <div>
          <label class="block text-xs font-semibold text-secondary mb-1">Start Time <span class="text-rose-500">*</span></label>
          <input type="text" 
                 id="start_time" 
                 name="start_time" 
                 value="{{ default_start_time|default('') }}" 
                 placeholder="09:00" 
                 required 
                 class="w-full text-xs font-mono rounded-lg border border-subtle px-3 py-2 bg-transparent text-main focus:outline-none focus:border-teal-500">
        </div>

        <!-- Selected End Time -->
        <div>
          <label class="block text-xs font-semibold text-secondary mb-1">End Time <span class="text-rose-500">*</span></label>
          <input type="text" 
                 id="end_time" 
                 name="end_time" 
                 value="{{ default_end_time|default('') }}" 
                 placeholder="09:20" 
                 required 
                 class="w-full text-xs font-mono rounded-lg border border-subtle px-3 py-2 bg-transparent text-main focus:outline-none focus:border-teal-500">
        </div>

        <!-- Type -->
        <div>
          <label class="block text-xs font-semibold text-secondary mb-1">Appointment Type</label>
          <select name="type" class="w-full text-xs rounded-lg border border-subtle px-3 py-2 bg-transparent text-main focus:outline-none focus:border-teal-500">
            <option value="Consultation">Consultation</option>
            <option value="Follow-up">Follow-up</option>
            <option value="Emergency">Emergency</option>
            <option value="Routine Checkup">Routine Checkup</option>
            <option value="Walk-in">Walk-in</option>
          </select>
        </div>

        <!-- Source -->
        <div>
          <label class="block text-xs font-semibold text-secondary mb-1">Booking Source</label>
          <select name="source" class="w-full text-xs rounded-lg border border-subtle px-3 py-2 bg-transparent text-main focus:outline-none focus:border-teal-500">
            <option value="Reception">Reception</option>
            <option value="Phone">Phone</option>
            <option value="Online">Online</option>
            <option value="Walk-in">Walk-in</option>
            <option value="Referral">Referral</option>
          </select>
        </div>

        <!-- Notes -->
        <div class="col-span-2">
          <label class="block text-xs font-semibold text-secondary mb-1">Notes / Chief Complaint</label>
          <textarea name="notes" rows="2" placeholder="e.g. Chest pain with mild shortness of breath..." class="w-full text-xs rounded-lg border border-subtle px-3 py-2 bg-transparent text-main focus:outline-none focus:border-teal-500"></textarea>
        </div>
      </div>

      <!-- Action Footer -->
      <div class="pt-3 border-t border-subtle flex items-center justify-end gap-2">
        <button type="button" 
                onclick="document.getElementById('modal-container').innerHTML = ''"
                class="px-3 py-1.5 rounded-lg border border-subtle surface-hover text-xs font-medium text-secondary">
          Cancel
        </button>
        <button type="submit" 
                class="flex items-center gap-1.5 px-4 py-1.5 rounded-lg bg-teal-600 hover:bg-teal-700 text-white text-xs font-semibold shadow-sm transition-colors">
          <i data-lucide="check" class="w-3.5 h-3.5"></i>
          <span>Confirm Booking</span>
        </button>
      </div>

    </form>
  </div>
</div>

<script>
  function selectSlot(start, end) {
    var startInput = document.getElementById('start_time');
    var endInput = document.getElementById('end_time');
    if (startInput) startInput.value = start;
    if (endInput) endInput.value = end;
  }
  lucide.createIcons();
</script>
