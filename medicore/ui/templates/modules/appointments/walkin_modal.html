<div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="surface-bg border border-subtle rounded-xl shadow-2xl w-full max-w-xl overflow-hidden flex flex-col max-h-[90vh]">
    
    <!-- Modal Header -->
    <div class="h-12 border-b border-subtle px-5 flex items-center justify-between bg-slate-50/50 dark:bg-slate-900/30">
      <div class="flex items-center gap-2">
        <div class="w-6 h-6 rounded-md bg-amber-500/10 text-amber-600 flex items-center justify-center">
          <i data-lucide="ticket" class="w-3.5 h-3.5"></i>
        </div>
        <h2 class="text-sm font-bold text-main">Quick Walk-In Registration & Live Token</h2>
      </div>
      <button onclick="document.getElementById('modal-container').innerHTML = ''" 
              class="p-1 rounded-lg surface-hover text-muted hover:text-main">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- Walk-In Form -->
    <form id="walkin-form"
          hx-post="/appointments/walkin"
          hx-target="#modal-container"
          class="flex-1 overflow-y-auto p-5 space-y-4"
          x-data="{ mode: 'existing' }">

      <!-- Patient Mode Toggle -->
      <div class="flex rounded-lg p-1 bg-slate-100 dark:bg-slate-800 text-xs font-medium">
        <button type="button" 
                @click="mode = 'existing'" 
                :class="mode === 'existing' ? 'bg-white dark:bg-slate-700 text-teal-600 shadow-sm' : 'text-muted'"
                class="flex-1 py-1.5 rounded-md text-center transition-all">
          Existing Patient
        </button>
        <button type="button" 
                @click="mode = 'quick_new'" 
                :class="mode === 'quick_new' ? 'bg-white dark:bg-slate-700 text-teal-600 shadow-sm' : 'text-muted'"
                class="flex-1 py-1.5 rounded-md text-center transition-all">
          Quick New Patient
        </button>
      </div>

      <!-- Existing Patient Selection -->
      <div x-show="mode === 'existing'" class="space-y-1">
        <label class="block text-xs font-semibold text-secondary">Select Registered Patient</label>
        <select name="patient_id" class="w-full text-xs rounded-lg border border-subtle px-3 py-2 bg-transparent text-main focus:outline-none focus:border-teal-500">
          <option value="">-- Choose Patient --</option>
          {% for p in patients %}
            <option value="{{ p.id }}">{{ p.mrn }} - {{ p.full_name }} ({{ p.phone }})</option>
          {% endfor %}
        </select>
      </div>

      <!-- Quick New Patient Details -->
      <div x-show="mode === 'quick_new'" class="space-y-3" style="display: none;">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-secondary mb-1">First Name</label>
            <input type="text" name="first_name" placeholder="John" class="w-full text-xs rounded-lg border border-subtle px-3 py-2 bg-transparent text-main">
          </div>
          <div>
            <label class="block text-xs font-semibold text-secondary mb-1">Last Name</label>
            <input type="text" name="last_name" placeholder="Doe" class="w-full text-xs rounded-lg border border-subtle px-3 py-2 bg-transparent text-main">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-secondary mb-1">Phone Number</label>
            <input type="text" name="phone" placeholder="+1 (555) 000-0000" class="w-full text-xs rounded-lg border border-subtle px-3 py-2 bg-transparent text-main">
          </div>
          <div>
            <label class="block text-xs font-semibold text-secondary mb-1">Gender</label>
            <select name="gender" class="w-full text-xs rounded-lg border border-subtle px-3 py-2 bg-transparent text-main">
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Doctor & Department Selection -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-secondary mb-1">Attending Doctor <span class="text-rose-500">*</span></label>
          <select name="doctor_id" required class="w-full text-xs rounded-lg border border-subtle px-3 py-2 bg-transparent text-main focus:outline-none focus:border-teal-500">
            <option value="">-- Select Doctor --</option>
            {% for d in doctors %}
              <option value="{{ d.id }}">
                {{ d.name }} ({{ d.department }} - {{ d.room_number or 'Rm 1' }})
              </option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-secondary mb-1">Walk-In Urgency</label>
          <select name="type" class="w-full text-xs rounded-lg border border-subtle px-3 py-2 bg-transparent text-main focus:outline-none focus:border-teal-500">
            <option value="Walk-in">Standard Walk-in</option>
            <option value="Emergency">Emergency Triage</option>
            <option value="Consultation">Immediate Consultation</option>
          </select>
        </div>
      </div>

      <!-- Notes -->
      <div>
        <label class="block text-xs font-semibold text-secondary mb-1">Reason for Visit / Symptoms</label>
        <input type="text" name="notes" placeholder="e.g. Acute abdominal pain, dizziness..." class="w-full text-xs rounded-lg border border-subtle px-3 py-2 bg-transparent text-main focus:outline-none focus:border-teal-500">
      </div>

      <!-- Token Notice -->
      <div class="p-3 rounded-lg bg-teal-50 dark:bg-teal-950/30 border border-teal-200 dark:border-teal-900 flex items-center gap-3">
        <i data-lucide="info" class="w-4 h-4 text-teal-600 flex-shrink-0"></i>
        <div class="text-xs text-teal-800 dark:text-teal-300">
          A sequential token number (e.g. <span class="font-mono font-bold">CARD-04</span>) will be instantly allocated and shown on the waiting room board.
        </div>
      </div>

      <!-- Action Footer -->
      <div class="pt-3 border-t border-subtle flex items-center justify-end gap-2">
        <button type="button" 
                onclick="document.getElementById('modal-container').innerHTML = ''"
                class="px-3 py-1.5 rounded-lg border border-subtle surface-hover text-xs font-medium text-secondary">
          Cancel
        </button>
        <button type="submit" 
                class="flex items-center gap-1.5 px-4 py-1.5 rounded-lg bg-amber-600 hover:bg-amber-700 text-white text-xs font-semibold shadow-sm transition-colors">
          <i data-lucide="printer" class="w-3.5 h-3.5"></i>
          <span>Issue Token & Check-In</span>
        </button>
      </div>

    </form>
  </div>
</div>
<script>lucide.createIcons();</script>
