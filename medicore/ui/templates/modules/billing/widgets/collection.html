<div class="space-y-3">
  <div class="flex items-center justify-between">
    <div>
      <span class="text-[10px] uppercase font-semibold text-muted block">Today's Total Collections</span>
      <span class="text-xl font-bold font-mono text-teal-600">${{ "%.2f"|format(today_collections) }}</span>
    </div>
    <div class="text-right">
      <span class="text-[10px] uppercase font-semibold text-muted block">Receipts Issued</span>
      <span class="text-base font-bold font-mono text-main">{{ today_count }}</span>
    </div>
  </div>

  <div class="pt-2 border-t border-subtle flex items-center justify-between text-xs">
    <div class="flex items-center gap-1.5">
      <span class="w-2 h-2 rounded-full {% if active_session %}bg-emerald-500 animate-pulse{% else %}bg-amber-500{% endif %}"></span>
      <span class="text-muted text-[11px]">
        {% if active_session %}
          Till: <strong class="text-main font-mono">{{ active_session.session_no }}</strong>
        {% else %}
          Till: Closed
        {% endif %}
      </span>
    </div>
    <a href="/billing" class="text-xs text-teal-600 hover:underline font-semibold flex items-center gap-0.5">
      <span>Billing Desk</span>
      <i data-lucide="chevron-right" class="w-3 h-3"></i>
    </a>
  </div>
</div>
