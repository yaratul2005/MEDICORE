<div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="surface-bg border border-subtle rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[90vh]">
    
    <!-- Modal Header -->
    <div class="px-5 py-3 border-b border-subtle flex items-center justify-between bg-slate-50/50 dark:bg-slate-900/30">
      <div class="flex items-center gap-2">
        <i data-lucide="user-plus" class="w-4 h-4 text-teal-600"></i>
        <h3 class="text-sm font-bold text-main">{{ modal_title }}</h3>
      </div>
      <button onclick="document.getElementById('modal-container').innerHTML = '';"
              class="text-muted hover:text-main p-1 rounded-lg">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- Duplicate Alert Container -->
    <div id="duplicate-alert-container" class="px-5 pt-3 empty:hidden"></div>

    <!-- Modal Form Body -->
    <form hx-post="{{ action_url }}"
          hx-target="#modal-container"
          hx-swap="outerHTML"
          class="flex-1 overflow-y-auto p-5 space-y-4">
      
      {% if patient %}
      <input type="hidden" name="id" value="{{ patient.id }}">
      {% endif %}

      {% import "macros/form.html" as f %}
      {{ f.render_form_fields(schema, patient) }}

      <!-- Hidden trigger for duplicate detection -->
      <div hx-post="/patients/check-duplicate"
           hx-trigger="keyup delay:350ms from:#phone, keyup delay:350ms from:#first_name, keyup delay:350ms from:#last_name, change from:#date_of_birth"
           hx-target="#duplicate-alert-container"
           hx-include="closest form"
           style="display:none;"></div>

      <!-- Action Footer -->
      <div class="pt-4 border-t border-subtle flex items-center justify-end gap-2.5">
        <button type="button"
                onclick="document.getElementById('modal-container').innerHTML = '';"
                class="px-4 py-2 rounded-lg border border-subtle text-xs font-semibold text-secondary hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
          Cancel
        </button>
        <button type="submit"
                class="px-4 py-2 rounded-lg bg-teal-600 hover:bg-teal-700 text-white text-xs font-semibold shadow-sm transition-colors flex items-center gap-1.5">
          <i data-lucide="save" class="w-3.5 h-3.5"></i>
          <span>Save Patient Record</span>
        </button>
      </div>
    </form>

  </div>
</div>
<script>lucide.createIcons();</script>
