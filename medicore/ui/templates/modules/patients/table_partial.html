{% import "macros/table.html" as t %}

{{ t.render_table(schema, patients, selected_id=selected_patient_id, base_url='/patients') }}

<!-- Pagination Controls -->
<div class="p-3 border-t border-subtle flex items-center justify-between text-xs text-muted surface-bg select-none">
  <div>
    Showing <span class="font-semibold text-main">{{ patients|length }}</span> of <span class="font-semibold text-main">{{ total_count }}</span> patients
  </div>

  <div class="flex items-center gap-1.5 font-mono">
    {% if page > 1 %}
    <button hx-get="/patients/table?page={{ page - 1 }}&q={{ q }}&status={{ status_filter }}&gender={{ gender_filter }}&blood_group={{ blood_filter }}"
            hx-target="#patients-table-container"
            class="px-2.5 py-1 rounded border border-subtle surface-hover text-secondary">
      Prev
    </button>
    {% endif %}

    <span class="px-2 py-1 text-[11px] text-muted">Page {{ page }} / {{ total_pages }}</span>

    {% if page < total_pages %}
    <button hx-get="/patients/table?page={{ page + 1 }}&q={{ q }}&status={{ status_filter }}&gender={{ gender_filter }}&blood_group={{ blood_filter }}"
            hx-target="#patients-table-container"
            class="px-2.5 py-1 rounded border border-subtle surface-hover text-secondary">
      Next
    </button>
    {% endif %}
  </div>
</div>
<script>lucide.createIcons();</script>
