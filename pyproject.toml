[project]
name = "medicore"
version = "0.1.0"
description = "MediCore - Modular Hospital Information System (HIS)"
readme = "README.md"
requires-python = ">=3.12, <3.14"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlmodel>=0.0.16",
    "alembic>=1.13.0",
    "pydantic-settings>=2.2.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10.4",
    "faker>=24.0.0",
    "httpx>=0.27.0",
    "reportlab>=4.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["medicore/tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["medicore*"]

